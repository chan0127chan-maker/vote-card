<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vote Card · 內容工作台</title><link rel="stylesheet" href="/admin/style.css"></head><body>
<header><a href="/">← 玩家頁</a><h1>苗栗・內容工作台</h1><button id="logout" hidden>登出</button></header>
<main><section id="login" hidden><h2 id="login-title">登入</h2><p id="login-note"></p><form id="login-form"><label>管理密碼<input id="password" type="password" minlength="12" maxlength="200" autocomplete="current-password" required></label><button>進入工作台</button></form></section>
<section id="workspace" hidden><div class="toolbar"><label>資料截至<input id="asof" type="date" required></label><span id="revision"></span><button id="save">儲存草稿</button><button id="publish" class="primary">發布到玩家頁</button></div><p>先在表格編輯並儲存草稿；發布後才會更新玩家頁。已寄出的信保留當時的資料。</p>
<nav aria-label="內容分類"><button data-view="words" aria-pressed="true">生活詞句</button><button data-view="topics" aria-pressed="false">議題與政見</button><button data-view="candidates" aria-pressed="false">候選人</button><button data-view="history" aria-pressed="false">修訂紀錄</button></nav>
<div class="toolbar"><label>搜尋<input id="search" type="search" placeholder="詞句、議題、候選人"></label><button id="new">新增</button></div><div class="table-scroll"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div></section><p id="status" role="status" aria-live="polite"></p></main>
<dialog id="editor"><form id="edit-form"><header><h2 id="edit-title"></h2><button id="cancel" type="button">取消</button></header><div id="fields"></div><p id="edit-error" role="alert"></p><button class="primary">套用到工作表</button></form></dialog>
<script type="module" src="/admin/app.mjs"></script></body></html>
